<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hospital GV - Triagem</title>

    <link rel="stylesheet" href="style5.css">
</head>

<body>

<div class="container">

    <!-- ==========================================
         CABEÇALHO
    =========================================== -->

    <div class="cabecalho">

        <h2>🏥 Triagem Hospitalar</h2>

        <button
            class="btn-abrir-tv"
            onclick="window.open('tv.html','_blank')"
        >
            📺 Abrir Tela da TV
        </button>

    </div>


    <!-- ==========================================
         FILA DE PACIENTES
    =========================================== -->

    <div class="pacientes-fila">

        <h3>

            <span class="titulo-fila">
                Pacientes Cadastrados no Atendimento
            </span>

            <span>
                Clique em "Chamar na TV" para chamar ao guichê
            </span>

        </h3>


        <div id="fila-pacientes">

            <p class="carregando">
                Carregando...
            </p>

        </div>


        <button
            class="btn-atualizar"
            onclick="carregarPacientes()"
        >
            🔄 Atualizar lista
        </button>

    </div>


    <hr>


    <!-- ==========================================
         FORMULÁRIO DE TRIAGEM
    =========================================== -->

    <h3>Formulário de Triagem</h3>


    <input
        id="nome"
        placeholder="Nome do paciente"
    >


    <select id="sintoma">

        <option value="">
            Selecione o sintoma
        </option>

        <option value="dor_leve">
            Dor leve
        </option>

        <option value="resfriado">
            Resfriado
        </option>

        <option value="coriza">
            Coriza
        </option>

        <option value="tosse">
            Tosse
        </option>

        <option value="febre">
            Febre
        </option>

        <option value="vomito">
            Vômito
        </option>

        <option value="diarreia">
            Diarreia
        </option>

        <option value="falta_ar_moderada">
            Falta de ar moderada
        </option>

        <option value="falta_ar_grave">
            Falta de ar grave
        </option>

        <option value="infarto">
            Suspeita de infarto
        </option>

        <option value="avc">
            Suspeita de AVC
        </option>

        <option value="convulsao">
            Convulsão
        </option>

        <option value="hemorragia">
            Hemorragia
        </option>

    </select>


    <input
        id="temp"
        type="number"
        placeholder="Temperatura"
    >


    <input
        id="alergia"
        placeholder="Alergias"
    >


    <textarea
        id="observacao"
        placeholder="Observações"
    ></textarea>


    <!-- Resultado da classificação -->

    <div id="resultado"></div>


    <!-- Botão salvar -->

    <button
        class="btn-salvar"
        onclick="salvar()"
    >
        Salvar Triagem
    </button>

</div>


<script>

/* ==========================================
   CARREGAR PACIENTES
========================================== */

function carregarPacientes() {

    fetch("/pacientes")

        .then(r => r.json())

        .then(pacientes => {

            const div =
                document.getElementById("fila-pacientes");


            // Mostra apenas pacientes aguardando triagem

            const fila =
                pacientes.filter(
                    p => p.status === "triagem"
                );


            // Nenhum paciente

            if (fila.length === 0) {

                div.innerHTML = `
                    <p class="nenhum-paciente">
                        Nenhum paciente aguardando.
                    </p>
                `;

                return;
            }


            div.innerHTML = "";


            // Cria os pacientes

            fila.forEach(p => {

                const item =
                    document.createElement("div");


                item.className = "fila-item";


                item.innerHTML = `

                    <div>

                        <strong>
                            ${p.nome}
                        </strong>

                        <br>

                        <small>
                            CPF: ${p.cpf || "—"}
                            |
                            Tipo: ${p.tipo || "—"}
                        </small>

                    </div>


                    <button
                        class="btn-tv"
                        onclick="chamarNaTV('${p.nome}')"
                    >
                        📺 Chamar na TV
                    </button>

                `;


                div.appendChild(item);

            });

        })


        .catch(() => {

            document.getElementById(
                "fila-pacientes"
            ).innerHTML = `

                <p class="erro-carregamento">
                    Erro ao carregar pacientes.
                </p>

            `;

        });

}


/* ==========================================
   CHAMAR PACIENTE NA TV
========================================== */

function chamarNaTV(nome) {

    fetch("/tv/chamar", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({

            localTipo: "GUICHÊ",

            localNumero: "01",

            paciente: nome

        })

    })


    .then(r => r.json())


    .then(() => {

        alert(
            "✅ " +
            nome +
            " foi chamado na TV para o Guichê 01!"
        );

    });

}


/* ==========================================
   CLASSIFICAÇÃO DE RISCO
========================================== */

function classificarRisco(
    sintoma,
    temperatura
) {

    const vermelhos = [

        "infarto",

        "avc",

        "convulsao",

        "hemorragia",

        "falta_ar_grave"

    ];


    const amarelos = [

        "febre",

        "vomito",

        "diarreia",

        "falta_ar_moderada"

    ];


    if (temperatura >= 39)

        return "vermelho";


    if (vermelhos.includes(sintoma))

        return "vermelho";


    if (amarelos.includes(sintoma))

        return "amarelo";


    return "verde";

}


/* ==========================================
   SALVAR TRIAGEM
========================================== */

function salvar() {

    const nome =
        document.getElementById("nome").value;


    const sintoma =
        document.getElementById("sintoma").value;


    const temperatura =
        Number(
            document.getElementById("temp").value
        );


    const alergia =
        document.getElementById("alergia").value;


    const observacao =
        document.getElementById("observacao").value;


    const risco =
        classificarRisco(
            sintoma,
            temperatura
        );


    fetch("/triagem", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({

            nome,

            sintoma,

            temperatura,

            alergia,

            observacao,

            risco

        })

    })


    .then(r => r.json())


    .then(data => {

        const resultado =
            document.getElementById(
                "resultado"
            );


        resultado.className =
            risco;


        resultado.innerHTML =
            "Classificação: " +
            risco.toUpperCase();


        alert(
            "Triagem salva com sucesso!"
        );

    });

}


/* ==========================================
   CARREGAR AO ABRIR
========================================== */

carregarPacientes();


/* ==========================================
   ATUALIZAR A CADA 10 SEGUNDOS
========================================== */

setInterval(
    carregarPacientes,
    10000
);

</script>

</body>
</html>
