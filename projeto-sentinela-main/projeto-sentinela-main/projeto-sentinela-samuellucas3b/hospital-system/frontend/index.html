<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital GV - Login</title>
    <link rel="stylesheet" href="style2.css">
</head>

<body>

    <div class="background">

        <div class="container">

            <img src="Gemini_Generated_Image_n3kofkn3kofkn3ko.jpg" alt="Logo Hospital GV" class="logo-login">

            <h1>Hospital GV</h1>

            <p class="subtitle">
                Sistema de Gestão Hospitalar
            </p>

            <div class="form">

                <div class="input-group">
                    <label for="usuario">Usuário</label>
                    <input
                        type="text"
                        id="usuario"
                        placeholder="Digite seu usuário"
                        autocomplete="username"
                    >
                </div>

                <div class="input-group">
                    <label for="senha">Senha</label>
                    <input
                        type="password"
                        id="senha"
                        placeholder="Digite sua senha"
                        autocomplete="current-password"
                    >
                </div>

                <p id="mensagem"></p>

                <button onclick="login()">
                    Entrar
                </button>

            </div>

            <div class="footer">
                <p>Hospital GV © 2026</p>
                <span>Sistema seguro de acesso</span>
            </div>

        </div>

    </div>

    <script>
        function login() {
            const usuario = document.getElementById("usuario").value.trim();
            const senha = document.getElementById("senha").value;
            const mensagem = document.getElementById("mensagem");

            if (usuario === "" || senha === "") {
                mensagem.textContent = "⚠️ Preencha usuário e senha.";
                mensagem.className = "erro";
                return;
            }

            mensagem.textContent = "Verificando acesso...";
            mensagem.className = "carregando";

            fetch("/login", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ usuario, senha })
            })
            .then(async response => {
                let data = {};

                try {
                    data = await response.json();
                } catch (_) {}

                if (response.status === 401) {
                    throw new Error("LOGIN_INVALIDO");
                }

                if (!response.ok) {
                    throw new Error(`SERVIDOR_${response.status}`);
                }

                return data;
            })
            .then(data => {
                if (data.tipo === "triagem") {
                    window.location.href = "triagem.html";
                } else if (data.tipo === "medico") {
                    window.location.href = "medico.html";
                } else if (data.tipo === "atendimento") {
                    window.location.href = "atendimento.html";
                } else {
                    mensagem.textContent = "❌ Tipo de usuário não reconhecido.";
                    mensagem.className = "erro";
                }
            })
            .catch(error => {
                console.error("Erro no login:", error);

                if (error.message === "LOGIN_INVALIDO") {
                    mensagem.textContent = "❌ Usuário ou senha incorretos.";
                } else {
                    mensagem.textContent = "❌ Não foi possível conectar ao servidor.";
                }

                mensagem.className = "erro";
            });
        }

        document.addEventListener("keydown", function(event) {
            if (event.key === "Enter") {
                login();
            }
        });
    </script>

</body>
</html>
